name: Infrastructure or software bug
description: Report a reproducible repository or implementation problem.
title: "[Bug] "
labels:
  - infrastructure
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic or disclosure-reviewed, release-approved inputs only.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and relevant Python, Node, or tool versions.

  - type: textarea
    id: validation
    attributes:
      label: Checks already run

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This report and its attachments contain no participant, private, raw, authentication, or identifying data.
          required: true
